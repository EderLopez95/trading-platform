syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc Validate (ValidateRequest) returns (UserResponse);
  rpc UpdateTelegram(UpdateTelegramRequest) returns (UserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc GetUser(GetUserRequest) returns (UserTelegramResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message ValidateRequest {
  string token = 1;
}

message UpdateTelegramRequest {
  string user_id = 1;
  string telegram_token = 2;
  string telegram_chat_id = 3;
}

message GetUsersRequest {
}

message GetUserRequest {
  string user_id = 1;
}

message AuthResponse {
  string user_id = 1;
  string token = 2;
}

message UserResponse {
  string user_id = 1;
  string email = 2;
  bool is_active = 3;
}

message UserTelegramResponse {
  string user_id = 1;
  string email = 2;
  string telegram_token = 3;
  string telegram_chat_id = 4;
}

message GetUsersResponse {
  repeated UserTelegramResponse users = 1;
}
