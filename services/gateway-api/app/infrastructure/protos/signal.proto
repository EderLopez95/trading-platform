syntax = "proto3";

import "google/protobuf/empty.proto";

service SignalService {
  rpc CreateConfiguration(CreateConfigurationRequest) returns (ConfigurationResponse);
  rpc GetConfigurations(GetConfigurationsRequest) returns (ConfigurationListResponse);
  rpc DeleteConfiguration(DeleteConfigurationRequest) returns (google.protobuf.Empty);
  rpc ToggleConfiguration(ToggleConfigurationRequest) returns (ConfigurationResponse);
  rpc UpdateConfiguration(UpdateConfigurationRequest) returns (ConfigurationResponse);
  rpc GetAnalysisStatus(AnalysisStatusRequest) returns (AnalysisStatusResponse);
  rpc ToggleAnalysis(ToggleAnalysisRequest) returns (AnalysisStatusResponse);
  rpc GetSignals(GetSignalsRequest) returns (GetSignalsResponse);
  rpc RefreshRegistries(RefreshRegistriesRequest) returns (RefreshRegistriesResponse);
}

message ConfigurationDto {
  string id = 1;
  string user_id = 2;
  repeated string symbols = 3;
  repeated string strategies = 4;
  string trend_timeframe = 5;
  string context_timeframe = 6;
  string entry_timeframe = 7;
  bool enabled = 8;
}

message SignalDto {
  string id = 1;
  string symbol = 2;
  string strategy = 3;
  string signal = 4;
  string trend_timeframe = 5;
  string context_timeframe = 6;
  string entry_timeframe = 7;
  double price = 8;
  string signal_time = 9;
}

message CreateConfigurationRequest {
  string user_id = 1;
  repeated string symbols = 2;
  repeated string strategies = 3;
  string trend_timeframe = 4;
  string context_timeframe = 5;
  string entry_timeframe = 6;
}

message GetConfigurationsRequest {
  string user_id = 1;
}

message DeleteConfigurationRequest {
  string configuration_id = 1;
}

message ToggleConfigurationRequest {
  string configuration_id = 1;
  bool enabled = 2;
}

message UpdateConfigurationRequest {
  string configuration_id = 1;
  repeated string symbols = 2;
  repeated string strategies = 3;
  string trend_timeframe = 4;
  string context_timeframe = 5;
  string entry_timeframe = 6;
}

message ToggleAnalysisRequest {
  string user_id = 1;
  bool enabled = 2;
}

message AnalysisStatusRequest {
  string user_id = 1;
}

message GetSignalsRequest {
  string user_id = 1;
  string symbol = 2;
  string strategy = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message RefreshRegistriesRequest {
}

message ConfigurationListResponse {
  repeated ConfigurationDto configurations = 1;
}

message ConfigurationResponse {
  ConfigurationDto configuration = 1;
}

message AnalysisStatusResponse {
  bool enabled = 1;
}

message GetSignalsResponse {
  repeated SignalDto signals = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total = 4;
}

message RefreshRegistriesResponse {
  bool success = 1;
}
