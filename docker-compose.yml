services:

  postgres:
    image: postgres:15
    container_name: trading_postgres
    restart: always
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  auth_service:
    build: ./services/auth-service
    container_name: auth_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: docker
      GRPC_PORT: 5051
      DATABASE_URL: postgresql://trading:trading@postgres:5432/trading_platform
      JWT_SECRET: trading-secret-key
      ENCRYPTION_KEY: 37iwsIZYfGJbWGWmldL4lXBAze-ESZpc7_ODD5AXzlc=
    ports:
      - "5051:5051"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5051"]
      interval: 5s
      timeout: 5s
      retries: 5

  signal_service:
    build: ./services/signal-service
    container_name: signal_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: docker
      GRPC_PORT: 5052
      DATABASE_URL: postgresql://trading:trading@postgres:5432/trading_platform
    ports:
      - "5052:5052"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5052"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway_api:
    build: ./services/gateway-api
    container_name: gateway_api
    depends_on:
      auth_service:
        condition: service_healthy
    environment:
      ENV: docker
      AUTH_SERVICE_HOST: auth_service
      AUTH_SERVICE_PORT: 5051
      AUTH_SERVICE_SECURE: "false"
      JWT_SECRET: trading-secret-key
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
